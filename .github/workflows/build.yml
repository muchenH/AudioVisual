name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # 建议改为 22 或 20
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      # 注意：如果仓库里没有 package-lock.json，这里请改成 npm install
      
    - name: Install Linux dependencies
      if: matrix.target == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ruby ruby-dev rubygems build-essential
        sudo gem install --no-document fpm
      
    - name: Build for Linux
      if: matrix.target == 'linux'
      run: npm run dist:linux -- --publish=never
      
    - name: Build for Windows
      if: matrix.target == 'win'
      run: npm run dist:win -- --publish=never
      
    - name: Upload Linux artifacts
      if: matrix.target == 'linux' && success()
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: |
          dist/*.deb
          dist/*.AppImage
        if-no-files-found: warn

    - name: Upload Windows artifacts
      if: matrix.target == 'win' && success()
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          dist/*.exe
          dist/*.zip
          dist/latest.yml
        if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          linux-build/*
          windows-build/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}