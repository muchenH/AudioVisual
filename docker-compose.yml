# AudioVisual Web 版（Docker）编排示例。
services:
  audiovisual-web:
    build: .
    image: audiovisual-web:latest
    container_name: audiovisual-web
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。改左侧数字即可换端口，例如 "8080:3000"。
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 设置持久化目录（自定义解析接口 / 影视导航）。
      - AV_DATA_DIR=/app/data
    volumes:
      - audiovisual-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  audiovisual-data:
